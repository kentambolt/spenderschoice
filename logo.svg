<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#0E9B8A"/>
    </linearGradient>
    <linearGradient id="tealSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Coin / account body -->
  <circle cx="32" cy="40" r="18" fill="url(#teal)"/>
  <circle cx="32" cy="40" r="18" fill="none" stroke="#0F1B26" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Inner check / S-curve inside coin (a subtle highlight) -->
  <path d="M25 41 c0 -4 14 -4 14 -8 c0 -2 -2 -3 -7 -3
           M32 30 v3
           M32 47 v3
           M25 39 c0 4 14 4 14 8 c0 2 -2 3 -7 3"
        stroke="#0F1B26" stroke-width="2" fill="none"
        stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.55"/>

  <!-- Forecast line above coin -->
  <path d="M9 22 L20 18 L28 24 L40 14 L55 8"
        stroke="url(#tealSoft)" stroke-width="3" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Forecast endpoints -->
  <circle cx="9"  cy="22" r="2"   fill="url(#tealSoft)"/>
  <circle cx="55" cy="8"  r="2.6" fill="url(#tealSoft)"/>
</svg>
